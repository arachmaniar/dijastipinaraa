<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jastipin — Kalkulator Jastip</title>
  <style>
    :root{--ink:#18202a;--muted:#737b86;--line:#e8ebef;--soft:#f7f8fa;--accent:#ffd85a;--sale:#ff6b6b}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff}
    button{font:inherit;cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}
    header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:#fff;z-index:5}
    .brand{font-weight:800;font-size:20px}.brand span{font-weight:500;color:var(--muted)}
    .page{display:none;padding:28px 20px 100px}.page.active{display:block}
    .intro{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center}
    .intro-inner{max-width:570px}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:12px}.intro h1{font-size:clamp(38px,7vw,64px);line-height:1.02;margin:0 0 18px;letter-spacing:-2px}.intro p{color:#59616c;line-height:1.7;margin:0 auto 28px;max-width:470px}
    .btn{border:0;border-radius:16px;padding:15px 24px;background:var(--ink);color:#fff;font-weight:750}.btn.light{background:var(--soft);color:var(--ink)}
    .hero-art{width:150px;height:120px;background:#fff4c7;border-radius:50% 45% 55% 40%;margin:0 auto 30px;display:grid;place-items:center;font-size:64px}
    .cats{display:flex;gap:8px;overflow:auto;padding:4px 0 20px}.cat{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:12px}.cat.active{background:#fff4c7;border-color:#ffe48a}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:6px 0 14px}.section-head h2{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.photo{height:190px;background:var(--soft);display:grid;place-items:center;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px;color:#b8bec6}.badge{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.card-body{padding:13px}.name{font-weight:750;font-size:14px;line-height:1.35}.store{font-size:11px;color:var(--muted);margin-top:4px}.small{font-size:11px;color:#69717b;margin-top:8px}.price{margin-top:10px;display:flex;gap:7px;align-items:baseline}.old{text-decoration:line-through;color:#a1a7ae;font-size:11px}.new{font-weight:800}.add{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;float:right;margin-top:-3px}
    .detail{max-width:720px;margin:auto}.detail-photo{height:390px;background:var(--soft);border-radius:24px;display:grid;place-items:center;font-size:90px;position:relative;overflow:hidden}.detail-photo img{width:100%;height:100%;object-fit:cover}.detail h1{font-size:28px;margin:20px 0 6px}.store-lg{color:var(--muted);font-size:13px}.desc{line-height:1.7;color:#59616c}.facts{border-top:1px solid var(--line);margin-top:22px}.fact{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.fact b{font-weight:600}
    .recap{max-width:760px;margin:auto}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.thumb{width:58px;height:58px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:25px;flex:none}.item-main{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:#fff}.summary{margin-top:22px;background:#f8f9fb;border-radius:20px;padding:18px}.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.total{margin-top:10px;background:#fff4c7;border-radius:14px;padding:15px;display:flex;justify-content:space-between;font-weight:850;font-size:18px}
    .top-actions{display:flex;gap:8px;align-items:center}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px}.cart-count{background:var(--sale);color:#fff;border-radius:99px;padding:2px 6px;font-size:10px;margin-left:3px}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.photo{height:170px}.detail-photo{height:300px}}
    @media(max-width:480px){header{padding:0 14px}.page{padding:22px 14px 100px}.grid{gap:10px}.card{border-radius:14px}.photo{height:150px}.intro h1{letter-spacing:-1px}.detail-photo{height:260px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">Jastipin <span>✈</span></div><div class="top-actions" id="headerActions"></div></header>

  <main id="intro" class="page active intro">
    <div class="intro-inner">
      <div class="hero-art">🛍️</div>
      <div class="eyebrow">JASTIP DARI INDONESIA</div>
      <h1>Belanja favoritmu,<br>kami bawakan.</h1>
      <p>Pilih barang dari katalog, tambahkan ke keranjang, dan kami hitungkan total belanja + fee jastip + ongkir & kemasan.</p>
      <button class="btn" onclick="showPage('catalog')">Mengerti →</button>
    </div>
  </main>

  <main id="catalog" class="page">
    <div class="cats" id="cats"></div>
    <div class="section-head"><h2 id="catTitle">Makanan Berat</h2><span class="muted" id="productCount"></span></div>
    <div class="grid" id="productGrid"></div>
  </main>

  <main id="detail" class="page">
    <div class="detail" id="detailContent"></div>
  </main>

  <main id="recap" class="page">
    <div class="recap"><div class="section-head"><h2>Rekap Pesanan</h2><button class="icon-btn" onclick="clearCart()">Hapus Semua</button></div>
      <div id="cartList"></div><div class="summary" id="summary"></div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="alert('Prototype checkout — sambungkan ke WhatsApp / payment flow di Roo Code.')">Lanjut ke Checkout →</button>
    </div>
  </main>
</div>

<script>
const categories=['Makanan Berat','Minuman','Snack','Roti & Kue','Sprei Adem','Sarung','Gendongan','Sarung Encim'];
const products=[
 {id:1,cat:'Makanan Berat',name:'Indomie Goreng 1 Dus (40 pcs)',store:'Toko Sinar Mas',old:120000,price:108000,sale:'Diskon 10%',note:'Rasa favorit, stok terbatas',desc:'Indomie goreng rasa original, cocok untuk stok rumah, usaha kuliner, atau kebutuhan harian.',material:'Tepung terigu, minyak nabati, bumbu',weight:'± 2.8 kg (1 dus)',pack:'Dus karton',icon:'🍜'},
 {id:2,cat:'Makanan Berat',name:'Beras Ramos 5kg',store:'Toko Makmur',old:72000,price:68400,sale:'Diskon 5%',note:'Beras pulen, kualitas bagus',desc:'Beras Ramos untuk kebutuhan rumah tangga dan usaha.',material:'Beras',weight:'5 kg',pack:'Karung plastik',icon:'🍚'},
 {id:3,cat:'Makanan Berat',name:'Mie Sedaap Cup (1 Dus)',store:'Toko Jaya',old:96000,price:88000,sale:'',note:'Rasa lengkap, praktis',desc:'Mie cup praktis untuk stok dan oleh-oleh.',material:'Tepung terigu, minyak nabati, bumbu',weight:'± 2 kg',pack:'Dus karton',icon:'🥡'},
 {id:4,cat:'Makanan Berat',name:'SunCo Minyak Goreng 2L',store:'Toko Sumber Rezeki',old:36000,price:33000,sale:'Diskon 8%',note:'Minyak goreng berkualitas',desc:'Minyak goreng untuk kebutuhan dapur.',material:'Minyak sawit',weight:'2 L',pack:'Botol plastik',icon:'🫗'},
 {id:5,cat:'Minuman',name:'Teh Botol 1 Dus',store:'Toko Makmur',old:75000,price:70000,sale:'',note:'Praktis untuk stok',desc:'Minuman teh kemasan.',material:'Teh, gula, air',weight:'± 4 kg',pack:'Dus',icon:'🧃'},
 {id:6,cat:'Snack',name:'Keripik Singkong Balado',store:'Toko Oleh-Oleh',old:30000,price:27000,sale:'Diskon 10%',note:'Gurih & pedas',desc:'Keripik singkong balado khas Indonesia.',material:'Singkong, bumbu balado',weight:'250 g',pack:'Pouch',icon:'🥔'},
 {id:7,cat:'Roti & Kue',name:'Brownies Kukus',store:'Toko Kue Solo',old:55000,price:50000,sale:'',note:'Fresh order',desc:'Brownies kukus lembut.',material:'Tepung, telur, cokelat',weight:'± 500 g',pack:'Box',icon:'🍰'},
 {id:8,cat:'Sprei Adem',name:'Sprei Microtex Disperse',store:'Toko Sprei Solo',old:175000,price:159000,sale:'Diskon 9%',note:'Halus & nyaman di kamar AC',desc:'Sprei dengan bahan microtex disperse yang terasa halus dan nyaman digunakan.',material:'Microtex disperse',weight:'± 1.2 kg',pack:'Plastik zipper',icon:'🛏️'},
 {id:9,cat:'Sarung',name:'Sarung Tenun Premium',store:'Toko Sarung',old:140000,price:125000,sale:'',note:'Motif klasik',desc:'Sarung tenun dengan motif klasik.',material:'Katun',weight:'± 650 g',pack:'Plastik',icon:'🧣'},
 {id:10,cat:'Gendongan',name:'Gendongan Bayi',store:'Toko Bayi',old:180000,price:165000,sale:'',note:'Ringan & praktis',desc:'Gendongan bayi praktis untuk aktivitas harian.',material:'Katun + webbing',weight:'± 600 g',pack:'Polybag',icon:'👶'},
 {id:11,cat:'Sarung Encim',name:'Sarung Encim Motif Batik',store:'Toko Batik Solo',old:190000,price:175000,sale:'Diskon 8%',note:'Motif heritage',desc:'Sarung encim dengan motif batik bernuansa heritage.',material:'Katun',weight:'± 700 g',pack:'Plastik',icon:'🪡'}
];
let selectedCat=categories[0], cart={};

const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');renderHeader();if(id==='catalog')renderCatalog();if(id==='recap')renderCart();window.scrollTo(0,0)}
function renderHeader(){const a=document.getElementById('headerActions');a.innerHTML=document.getElementById('intro').classList.contains('active')?'':`<button class="icon-btn" onclick="showPage('catalog')">Katalog</button><button class="icon-btn" onclick="showPage('recap')">🛒 <span class="cart-count">${Object.values(cart).reduce((a,b)=>a+b,0)}</span></button>`}
function renderCats(){document.getElementById('cats').innerHTML=categories.map(c=>`<button class="cat ${c===selectedCat?'active':''}" onclick="selectedCat='${c}';renderCatalog()"> ${c}</button>`).join('')}
function renderCatalog(){renderCats();let ps=products.filter(p=>p.cat===selectedCat);document.getElementById('catTitle').textContent=selectedCat;document.getElementById('productCount').textContent=ps.length+' produk';document.getElementById('productGrid').innerHTML=ps.map(p=>`<article class="card"><div class="photo" onclick="detail(${p.id})">${p.sale?`<span class="badge">${p.sale}</span>`:''}<div class="placeholder">${p.icon}</div></div><div class="card-body"><div class="name">${p.name}</div><div class="store">⌂ ${p.store}</div><div class="small">${p.note}</div><div class="price"><span class="old">${rupiah(p.old)}</span><span class="new">${rupiah(p.price)}</span><button class="add" onclick="event.stopPropagation();add(${p.id})">+</button></div></div></article>`).join('')}
function detail(id){let p=products.find(x=>x.id===id);document.getElementById('detailContent').innerHTML=`<button class="icon-btn" onclick="showPage('catalog')">← Kembali</button><div class="detail-photo" style="margin-top:14px">${p.sale?`<span class="badge">${p.sale}</span>`:''}${p.icon}</div><h1>${p.name}</h1><div class="store-lg">⌂ ${p.store}</div><p class="desc">${p.desc}</p><div class="facts"><div class="fact"><span>Bahan</span><b>${p.material}</b></div><div class="fact"><span>Berat</span><b>${p.weight}</b></div><div class="fact"><span>Kemasan</span><b>${p.pack}</b></div></div><button class="btn" style="width:100%;margin-top:20px" onclick="add(${p.id});showPage('recap')">Tambah ke Keranjang</button>`;showPage('detail')}
function add(id){cart[id]=(cart[id]||0)+1;renderHeader()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart();renderHeader()}
function clearCart(){cart={};renderCart();renderHeader()}
function renderCart(){let ids=Object.keys(cart);document.getElementById('cartList').innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id==id),q=cart[id];return `<div class="item"><div class="thumb">${p.icon}</div><div class="item-main"><div class="name">${p.name}</div><div class="store">${p.store}</div><b>${rupiah(p.price*q)}</b></div><div class="qty"><button onclick="change(${p.id},-1)">−</button>${q}<button onclick="change(${p.id},1)">+</button></div></div>`}).join(''):'<p class="muted">Belum ada item. Pilih produk dari katalog.</p>';
let raw=ids.reduce((s,id)=>s+products.find(x=>x.id==id).old*cart[id],0), buy=ids.reduce((s,id)=>s+products.find(x=>x.id==id).price*cart[id],0), stores=new Set(ids.map(id=>products.find(x=>x.id==id).store)).size, items=Object.values(cart).reduce((a,b)=>a+b,0), fee=stores*15000+Math.max(0,items-stores)*3000, ship=25000,total=buy+fee+ship;
document.getElementById('summary').innerHTML=`<div class="row"><span>Nominal pembelian<small>Harga sebelum diskon</small></span><b>${rupiah(raw)}</b></div><div class="row"><span>Total Belanja<small>Harga setelah diskon</small></span><b>${rupiah(buy)}</b></div><div class="row"><span>Jumlah Toko</span><b>${stores}</b></div><div class="row"><span>Fee Jastip<small>Rp15.000/toko + Rp3.000/item ke-4 dst</small></span><b>${rupiah(fee)}</b></div><div class="row"><span>Biaya Ongkir & Kemasan<small>Ambil dari Google Sheet</small></span><b>${rupiah(ship)}</b></div><div class="total"><span>Total</span><span>${rupiah(total)}</span></div>`}
renderHeader();
</script>
</body>
</html>
